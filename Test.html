<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        .add {
            height: 45px;
            width: 100px;
            background-color: white;
            color: black;
            border: solid 2px black;
            border-radius: 15px;
            box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
            margin-left: 20px;
        }
        .add:active {
            scale: 0.95;
        }
        .container {
            height: 500px;
            width: 250px;
            border: solid 2px black;
            border-radius: 15px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 10px;
        }
        .box {
            background-color: rgba(0, 0, 0, 0.2);
            height: 100px;
            width: 250px;
            border: solid 2px black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .delete {
            border: none;
            background-color: black;
            color: white;
            width: 100px;
            height: 45px;
            border-radius: 15px;
        }
        .delete:active {
            scale: 0.95;
        }
    </style>
</head>
<body>

    <button class="add js-add">Add</button>
    <div class="container js-container">
        <div class="box">
            <button class="delete js-delete">Delete</button>
        </div>
    </div>

    <script>

        let cart = [];

        document.querySelector('.js-add')
          .addEventListener('click', () => {
             addToCart();
          })

        function addToCart() {
            cart.push({
                name: 'box'
            })
            console.log(cart);
            displayCart();
        }

        displayCart();

        function displayCart() {
            let cartHtml = '';
            cart.forEach(() => {
                let html = `<div class="box">
                                <button class="delete js-delete">Delete</button>
                            </div>`;
                cartHtml += html;
            })
            document.querySelector('.js-container').innerHTML = cartHtml;
            document.querySelectorAll('.js-delete')
                .forEach((button, i) => {
                    button.addEventListener('click', () => {
                        console.log(cart)
                        cart.splice(i, 1);
                        displayCart();
                    })
                })
        }

    </script>

</body>
</html>
